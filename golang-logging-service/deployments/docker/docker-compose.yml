version: '3.8'

services:
  app:
    build:
      context: ../../
      dockerfile: deployments/docker/Dockerfile
    container_name: golang-logging-service
    ports:
      - "8080:8080"
    volumes:
      - logs:/var/log/golang-logging-service
      - ../../scripts:/app/scripts
    environment:
      - LOG_LEVEL=DEBUG
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
    restart: unless-stopped
    networks:
      - app-network
    depends_on:
      - localstack

  localstack:
    image: localstack/localstack:latest
    container_name: localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3
      - DEBUG=1
      - DATA_DIR=/tmp/localstack/data
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - localstack-data:/tmp/localstack
      - ../../monitoring/localstack/config.json:/etc/localstack/config.json
      - ../../scripts:/scripts
    networks:
      - app-network

  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki
      - ../../monitoring/loki/loki-config.yaml:/etc/loki/config.yaml
    command: -config.file=/etc/loki/config.yaml
    networks:
      - app-network

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    volumes:
      - logs:/var/log/golang-logging-service
      - ../../monitoring/loki/promtail-config.yaml:/etc/promtail/config.yaml
    command: -config.file=/etc/promtail/config.yaml
    depends_on:
      - loki
    networks:
      - app-network

  s3-to-loki-sync:
    image: amazon/aws-cli:latest
    container_name: s3-to-loki-sync
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - ../../scripts:/scripts
    networks:
      - app-network
    depends_on:
      - localstack
      - loki
    command: >
      /bin/sh -c "
        apk add --no-cache curl jq bash && 
        chmod +x /scripts/logs-loki.sh && 
        while true; do
          /scripts/logs-loki.sh;
          sleep 300;
        done
      "

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
    networks:
      - app-network

  # Cron container to handle log rotation
  log-rotator:
    image: alpine:latest
    container_name: log-rotator
    volumes:
      - logs:/var/log/golang-logging-service
      - ../../scripts:/scripts
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
    networks:
      - app-network
    depends_on:
      - app
      - localstack
    command: >
      /bin/sh -c "
        apk add --no-cache aws-cli bash gzip findutils && 
        chmod +x /scripts/log-rotate.sh && 
        echo '0 0 * * * /scripts/log-rotate.sh > /proc/1/fd/1 2>/proc/1/fd/2' > /etc/crontabs/root && 
        crond -f -d 8
      "

volumes:
  logs:
  localstack-data:
  loki-data:
  grafana-data:

networks:
  app-network:
    driver: bridge