apiVersion: apps/v1
kind: Deployment
metadata:
  name: golang-logging-service
  labels:
    app: golang-logging-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: golang-logging-service
  template:
    metadata:
      labels:
        app: golang-logging-service
    spec:
      containers:
      - name: golang-logging-service
        image: your-docker-image:latest
        ports:
        - containerPort: 8080
        env:
        - name: LOG_LEVEL
          value: "INFO"
        volumeMounts:
        - name: log-volume
          mountPath: /var/log/golang-logging-service
      volumes:
      - name: log-volume
        emptyDir: {}