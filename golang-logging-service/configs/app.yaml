application:
  name: golang-logging-service
  version: 1.0.0
  environment: development
  log_level: INFO
  log_file: /var/log/golang-logging-service/app.log
  log_rotation:
    max_size: 10MB
    max_backups: 5
    max_age: 30
  server:
    port: 8080
    read_timeout: 5s
    write_timeout: 10s
  database:
    host: localhost
    port: 5432
    user: user
    password: password
    name: dbname